# Render Blueprint: one Web Service that serves both the Django API (/api/) and the
# built React app. See "Deployment" in CLAUDE.md for how it fits together.
services:
  - type: web
    name: portfolio
    runtime: python # `env: python` is the deprecated spelling of the same thing
    plan: free
    region: singapore
    # Versions come from .python-version and .node-version at the repo root.
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Keep --workers 2: with DB_CONN_MAX_AGE=0 that caps the API at ~2 Aiven connections.
    startCommand: cd backend && gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      # sync: false = Render prompts for the value in the dashboard; it is never stored in the repo.
      # generateValue: true = Render creates a random value itself (kept across deploys).
      - key: DATABASE_URL # Aiven Service URI, ending ?sslmode=require
        sync: false
      - key: DJANGO_SECRET_KEY # generated by Render on first deploy; also needed at build time (collectstatic)
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS # this service's host, no scheme, e.g. portfolio.onrender.com
        sync: false
      # Not secrets, so the defaults live here.
      - key: DJANGO_DEBUG
        value: "false"
      - key: DB_CONN_MAX_AGE
        value: "0"
